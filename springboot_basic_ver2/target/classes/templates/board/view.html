<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>게시글 보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { padding: 30px 0; }
        .board-info { background-color: #f8f9fa; padding: 15px; border-radius: 5px; }
        .content { min-height: 300px; margin: 20px 0; padding: 20px; border: 1px solid #dee2e6; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4" th:text="${board.title}">제목</h2>

    <div class="board-info">
        <div class="row">
            <div class="col-md-6">
                <strong>작성자:</strong> <span th:text="${board.userId}">작성자</span>
            </div>
            <div class="col-md-6 text-md-end">
                <strong>작성일:</strong>
                <span th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd HH:mm')}">
                        2024-01-01</span>
                <strong class="ms-3">조회수:</strong>
                <span th:text="${board.viewCount}">0</span>
            </div>
        </div>
    </div>

    <div class="content" th:text="${board.content}">
        내용
    </div>

    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <a th:href="@{/board/list}" class="btn btn-secondary me-md-2">목록</a>

        <!-- 작성자만 수정/삭제 가능 -->
        <th:block th:if="${#authentication.name == board.userId}">
            <a th:href="@{/board/edit/{id}(id=${board.boardId})}"
               class="btn btn-primary me-md-2">수정</a>

            <form th:action="@{/board/delete/{id}(id=${board.boardId})}"
                  method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
            </form>
        </th:block>SCOTT
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
