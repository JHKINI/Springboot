
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">

    <!-- CSRF 토큰 -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <title>게시글 상세</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .container {
            padding: 30px 0;
        }

        .board-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
        }

        .content {
            min-height: 200px;
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            white-space: pre-wrap;
        }

        .comments-section {
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 게시글 제목 -->
    <h2 class="mb-4" th:text="${board.title}">게시글 제목</h2>

    <!-- 게시글 정보 -->
    <div class="board-info">
        <div class="row">
            <div class="col-md-6">
                <strong>작성자:</strong>
                <span th:text="${board.userId}">작성자</span>
            </div>

            <div class="col-md-6 text-md-end">
                <strong>작성일:</strong>
                <span th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd HH:mm')}">
                    작성일
                </span>

                <strong class="ms-3">조회수:</strong>
                <span th:text="${board.viewCount}">0</span>
            </div>
        </div>
    </div>

    <!-- 게시글 내용 -->
    <!-- Toast UI Viewer -->
    <div id="viewer" class="content"></div>

    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

    <script th:inline="javascript">
        const content = /*[[${board.content}]]*/ '';

        toastui.Editor.factory({
            el: document.querySelector('#viewer'),
            viewer: true,
            initialValue: content
        });
    </script>

    <!-- 첨부파일 목록 -->
    <div class="mt-3"
         th:if="${files != null and !#lists.isEmpty(files)}">

        <h5>첨부파일</h5>

        <ul class="list-group">
            <li class="list-group-item"
                th:each="file : ${files}">

                <a th:href="@{/board/download/{fileId}(fileId=${file.fileId})}"
                   th:text="${file.originalFileName}">
                    파일명
                </a>

                <span class="text-muted"
                      th:text="'(' + ${#numbers.formatDecimal(file.fileSize / 1024.0, 0, 2)} + ' KB)'">
                </span>

            </li>
        </ul>
    </div>

    <!-- 댓글 영역 -->
    <div class="comments-section">

        <h4 class="mb-3">댓글</h4>

        <!-- 게시글 번호 -->
        <input type="hidden" id="boardId"
               th:value="${board.boardId}">

        <!-- 댓글 작성 폼 -->
        <div class="comment-form mb-4"
             sec:authorize="isAuthenticated()">

            <form id="commentForm">

                <div class="form-group">
                    <textarea class="form-control"
                              id="commentContent"
                              rows="3"
                              placeholder="댓글을 입력하세요"></textarea>
                </div>

                <div class="text-end mt-2">
                    <button type="submit"
                            class="btn btn-primary">
                        댓글 작성
                    </button>
                </div>

            </form>
        </div>

        <!-- 댓글 목록 -->
        <div id="commentList">
            <p class="text-muted">댓글을 불러오는 중입니다.</p>
        </div>

    </div>

    <!-- 게시글 수정 / 삭제 / 목록 -->
    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">

        <!-- 작성자만 수정 및 삭제 가능 -->
        <th:block th:if="${#authentication.name == board.userId}">

            <a th:href="@{/board/edit/{id}(id=${board.boardId})}"
               class="btn btn-primary">
                수정
            </a>

            <form th:action="@{/board/delete/{id}(id=${board.boardId})}"
                  method="post">

                <button type="submit"
                        class="btn btn-danger"
                        onclick="return confirm('정말 삭제하시겠습니까?')">
                    삭제
                </button>

            </form>

        </th:block>

        <a th:href="@{/board/list}"
           class="btn btn-secondary">
            목록
        </a>

    </div>

</div>

<!-- 로그인 사용자 정보 -->
<script th:inline="javascript">
    const currentUser = [[${#authentication.name}]];
</script>

<!-- 댓글 기능 -->
<script>

    const boardId = document.getElementById('boardId').value;

    // CSRF 토큰
    const csrfHeader =
        document.querySelector('meta[name="_csrf_header"]')?.content;

    const csrfToken =
        document.querySelector('meta[name="_csrf"]')?.content;

    const headers = {
        'Content-Type': 'application/json'
    };

    if (csrfHeader && csrfToken) {
        headers[csrfHeader] = csrfToken;
    }

    // 댓글 목록 조회
    function loadComments() {

        fetch(`/api/comments/board/${boardId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('댓글 조회 실패');
                }
                return response.json();
            })
            .then(comments => {

                const commentList =
                    document.getElementById('commentList');

                if (comments.length === 0) {
                    commentList.innerHTML =
                        '<p class="text-muted">등록된 댓글이 없습니다.</p>';
                    return;
                }

                commentList.innerHTML = comments.map(comment => `
                    <div class="comment card mb-2"
                         data-comment-id="${comment.commentId}">

                        <div class="card-body">

                            <div class="d-flex justify-content-between">

                                <div>
                                    <strong>${escapeHtml(comment.userId)}</strong>
                                    <small class="text-muted ms-2">
                                        ${new Date(comment.regDate).toLocaleString()}
                                    </small>
                                </div>

                                ${comment.userId === currentUser ? `
                                    <div>
                                        <button onclick="editComment(${comment.commentId})"
                                                class="btn btn-sm btn-outline-primary">
                                            수정
                                        </button>

                                        <button onclick="deleteComment(${comment.commentId})"
                                                class="btn btn-sm btn-outline-danger">
                                            삭제
                                        </button>
                                    </div>
                                ` : ''}

                            </div>

                            <p class="mt-2 mb-0 comment-content">
                                ${escapeHtml(comment.content)}
                            </p>

                        </div>
                    </div>
                `).join('');

            })
            .catch(error => {

                console.error('댓글 로딩 오류:', error);

                document.getElementById('commentList').innerHTML =
                    '<div class="alert alert-danger">댓글을 불러오는 중 오류가 발생했습니다.</div>';

            });
    }

    // 댓글 내용 HTML 이스케이프
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    // 댓글 작성
    const commentForm = document.getElementById('commentForm');

    if (commentForm) {

        commentForm.addEventListener('submit', function(e) {

            e.preventDefault();

            const content =
                document.getElementById('commentContent').value.trim();

            if (!content) {
                alert('댓글 내용을 입력해주세요.');
                return;
            }

            fetch('/api/comments', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    boardId: boardId,
                    content: content
                })
            })
                .then(response => {

                    if (!response.ok) {
                        throw new Error('댓글 작성 실패');
                    }

                    document.getElementById('commentContent').value = '';

                    loadComments();

                })
                .catch(error => {

                    console.error('댓글 작성 오류:', error);
                    alert('댓글 작성 중 오류가 발생했습니다.');

                });

        });

    }

    // 댓글 삭제
    function deleteComment(commentId) {

        if (!confirm('정말 삭제하시겠습니까?')) {
            return;
        }

        fetch(`/api/comments/${commentId}`, {
            method: 'DELETE',
            headers: headers
        })
            .then(response => {

                if (!response.ok) {
                    throw new Error('댓글 삭제 실패');
                }

                loadComments();

            })
            .catch(error => {

                console.error('댓글 삭제 오류:', error);
                alert('댓글 삭제 중 오류가 발생했습니다.');

            });

    }

    // 댓글 수정
    function editComment(commentId) {

        const commentElement =
            document.querySelector(`[data-comment-id="${commentId}"]`);

        const content =
            commentElement.querySelector('.comment-content').textContent.trim();

        const newContent = prompt('댓글을 수정하세요:', content);

        if (newContent && newContent.trim() !== '') {

            fetch(`/api/comments/${commentId}`, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify({
                    content: newContent.trim()
                })
            })
                .then(response => {

                    if (!response.ok) {
                        throw new Error('댓글 수정 실패');
                    }

                    loadComments();

                })
                .catch(error => {

                    console.error('댓글 수정 오류:', error);
                    alert('댓글 수정 중 오류가 발생했습니다.');

                });

        }

    }

    // 페이지 로드 시 댓글 목록 불러오기
    loadComments();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
