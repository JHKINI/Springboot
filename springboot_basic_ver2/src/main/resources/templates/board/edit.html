
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Toast UI Editor CSS -->
    <link rel="stylesheet"
          href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">

    <style>
        .container {
            padding: 30px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">게시글 수정</h2>

    <form th:action="@{/board/edit/{id}(id=${board.boardId})}"
          method="post"
          enctype="multipart/form-data"
          id="editForm">

        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text"
                   class="form-control"
                   id="title"
                   name="title"
                   th:value="${board.title}"
                   required
                   maxlength="200">
        </div>

        <div class="mb-3">
            <label class="form-label">내용</label>

            <!-- Toast UI Editor -->
            <div id="editor"></div>

            <!-- 수정된 내용을 서버로 전달 -->
            <input type="hidden"
                   id="content"
                   name="content">
        </div>

        <!-- 기존 첨부파일 목록 -->
        <div class="mb-3"
             th:if="${not #lists.isEmpty(files)}">

            <label class="form-label">첨부파일</label>

            <div class="list-group">
                <div class="list-group-item"
                     th:each="file : ${files}">

                    <div class="d-flex justify-content-between align-items-center">
                        <span th:text="${file.originalFileName}"></span>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="deleteFiles"
                                   th:value="${file.fileId}">

                            <label class="form-check-label">삭제</label>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- 새로운 파일 추가 -->
        <div class="mb-3">
            <label for="files" class="form-label">
                새로운 파일 추가
            </label>

            <input type="file"
                   class="form-control"
                   id="files"
                   name="files"
                   multiple>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">

            <a th:href="@{/board/view/{id}(id=${board.boardId})}"
               class="btn btn-secondary me-md-2">
                취소
            </a>

            <button type="submit" class="btn btn-primary">
                수정
            </button>

        </div>
    </form>
</div>

<!-- Toast UI Editor JS -->
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script th:inline="javascript">

    // 기존 게시글 내용 가져오기
    const initialContent = /*[[${board.content}]]*/ '';

    // Toast UI Editor 생성
    const editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '400px',
        initialEditType: 'markdown',
        previewStyle: 'vertical',
        initialValue: initialContent
    });

    // 수정 버튼 클릭 시 에디터 내용 전달
    document.getElementById('editForm').addEventListener('submit', function(e) {

        const content = editor.getMarkdown();

        if (!content.trim()) {
            e.preventDefault();
            alert('내용을 입력해주세요.');
            return;
        }

        document.getElementById('content').value = content;

    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
